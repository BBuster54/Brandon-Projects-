name: Carbon calculator
on:
  push:
    paths: ['carbon-footprint-tracker/**', '.github/workflows/carbon.yml']
  pull_request:
    paths: ['carbon-footprint-tracker/**', '.github/workflows/carbon.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carbon-footprint-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: carbon-footprint-tracker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm test
      - run: python -m pytest tests/test_model.py -q
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carbon-lighthouse
          path: carbon-footprint-tracker/.lighthouseci
