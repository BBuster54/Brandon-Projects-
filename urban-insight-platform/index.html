<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Insight — Smart City Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Urban Insight</h1>
      <p>Explore environmental, mobility, and housing indicators across U.S. cities</p>
    </div>
  </header>

  <nav class="nav">
    <div class="container nav-container">
      <ul class="nav-links">
        <li><a href="#" data-view="overview" class="active">Overview</a></li>
        <li><a href="#" data-view="environment">Environment</a></li>
        <li><a href="#" data-view="transportation">Transportation</a></li>
        <li><a href="#" data-view="housing">Housing</a></li>
      </ul>
    </div>
  </nav>

  <section class="filters">
    <div class="container filters-container">
      <div class="filter-group">
        <label for="citySelector">City</label>
        <select id="citySelector"></select>
      </div>
      <button id="refreshData" class="btn btn-primary">Reset View</button>
    </div>
  </section>

  <main class="main-content">
    <div class="container" id="mainContent"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Built by Brandon Best &mdash; a static-data prototype exploring the intersection of environmental science and software engineering.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
